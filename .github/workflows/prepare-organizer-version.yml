name: Prepare organizer version
on:
  push:
    branches: [maintenance/verified-storage-cleanup-20261106]
    paths: [.github/workflows/prepare-organizer-version.yml]
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Update only the product version in the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64, json, os, re, tomllib, urllib.request
          repo = os.environ['GH_REPO']
          assert repo == 'TechWisard/desktop-pilot'
          branch = 'integration/desktop-pilot-completion-20261106'
          expected = 'a05f6b0e366d2384adc0804a2109502a4fce6084'
          prefix = f'https://api.github.com/repos/{repo}/'
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}
          def api(path, data=None, method=None):
              request = urllib.request.Request(prefix+path, data=None if data is None else json.dumps(data).encode(), headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response: return json.load(response)
          assert api('git/ref/heads/'+branch)['object']['sha'] == expected, 'Candidate changed; no write allowed'
          parent = api('git/commits/'+expected)
          elements = []
          for path in ('Cargo.toml','Cargo.lock'):
              file = api('contents/'+path+'?ref='+expected)
              old = base64.b64decode(file['content']).decode('utf-8')
              before = tomllib.loads(old)
              if path == 'Cargo.toml':
                  assert before['package']['name'] == 'desktop-pilot' and before['package']['version'] == '0.2.122'
                  new, count = re.subn(r'(?m)^version = "0\.2\.122"$', 'version = "0.3.0"', old, count=1)
                  before['package']['version'] = '0.3.0'
              else:
                  owned = [p for p in before['package'] if p['name'] == 'desktop-pilot']
                  assert len(owned) == 1 and owned[0]['version'] == '0.2.122'
                  pattern = r'(\[\[package\]\]\nname = "desktop-pilot"\nversion = ")0\.2\.122(")'
                  new, count = re.subn(pattern, r'\g<1>0.3.0\2', old)
                  owned[0]['version'] = '0.3.0'
              assert count == 1 and tomllib.loads(new) == before
              blob = api('git/blobs', {'content':new, 'encoding':'utf-8'}, 'POST')
              elements.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree = api('git/trees', {'base_tree':parent['tree']['sha'],'tree':elements}, 'POST')
          commit = api('git/commits', {'message':'Prepare Desktop Pilot 0.3.0 organizer candidate','tree':tree['sha'],'parents':[expected]}, 'POST')
          assert api('git/ref/heads/'+branch)['object']['sha'] == expected, 'Concurrent change; do not advance the branch'
          api('git/refs/heads/'+branch, {'sha':commit['sha'],'force':False}, 'PATCH')
          print(json.dumps({'commit':commit['sha'],'parent':expected,'tree':tree['sha'],'changed_paths':[e['path'] for e in elements],'version':'0.3.0','dependency_changes':0,'release_published':False}))
