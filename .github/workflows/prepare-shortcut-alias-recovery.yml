name: Prepare shortcut alias recovery
on:
  push:
    branches: [fix/shortcut-alias-recovery-20261026]
    paths: [.github/workflows/prepare-shortcut-alias-recovery.yml, scripts/prepare-shortcut-alias-recovery.py, src/engine/alias_recovery_tests.rs]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'TechWisard/desktop-pilot' && github.ref == 'refs/heads/fix/shortcut-alias-recovery-20261026'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - name: Reproduce, fix and verify without rewriting history
        shell: pwsh
        run: python scripts/prepare-shortcut-alias-recovery.py
      - name: Regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alias-recovery-before-after
          path: target/alias-recovery/
          if-no-files-found: error
          retention-days: 14
