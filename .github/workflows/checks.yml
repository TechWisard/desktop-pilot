name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: Native integration fixtures
        shell: pwsh
        run: ./scripts/test-native.ps1
      - name: Native check reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-checks-${{ matrix.os }}
          path: target/native-checks/
          if-no-files-found: ignore
          retention-days: 14
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Desktop Pilot ')
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.93.1'
      - name: Build and verify release executable
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -SkipChecks
          ./scripts/test-native.ps1 -Executable target/release/desktop-pilot.exe -ReportDirectory target/release-checks
          ./scripts/package-release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Could not read package version' }
          $version = ($metadata.packages | Where-Object name -eq 'desktop-pilot').version
          $tag = "v$version"
          $notes = "docs/releases/$version.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Release notes are missing: $notes" }
          $existingText = gh release view $tag --json isDraft,tagName 2>$null
          $existing = if ($LASTEXITCODE -eq 0) { $existingText | ConvertFrom-Json } else { $null }
          if ($existing -and -not $existing.isDraft) { throw "Release $tag is already published" }
          $assets = @("dist/DesktopPilot-$version-windows-x64.zip", "dist/DesktopPilot-$version-source.zip", 'dist/SHA256SUMS.txt')
          if (-not $existing) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "Desktop Pilot $version" --notes-file $notes
            if ($LASTEXITCODE) { throw 'Could not prepare release' }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE) { throw 'Could not upload release assets' }
          $publishedAssets = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Could not verify release assets' }
          $expected = @($assets | ForEach-Object { [System.IO.Path]::GetFileName($_) })
          if (@($publishedAssets.assets | Where-Object { $_.name -in $expected -and $_.size -gt 0 }).Count -ne $expected.Count) {
            throw 'Release assets are incomplete'
          }
          gh release edit $tag --draft=false --latest --notes-file $notes
          if ($LASTEXITCODE) { throw 'Could not publish release' }
      - name: Release verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verification
          path: target/release-checks/
          if-no-files-found: ignore
          retention-days: 30
