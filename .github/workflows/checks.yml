name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - name: README installation instructions
        run: python scripts/test-readmes.py
      - name: Release publication guards
        shell: pwsh
        run: ./scripts/test-release-workflow.ps1
      - run: cargo fmt --check
      - run: cargo test --locked
        if: success() || failure()
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: Native integration fixtures
        shell: pwsh
        run: ./scripts/test-native.ps1
      - name: Live Explorer organization acceptance
        if: matrix.os == 'windows-2025'
        shell: pwsh
        env:
          DESKTOP_PILOT_DISPOSABLE_DESKTOP: '1'
        run: |
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe; Start-Sleep -Seconds 3 }
          cargo test --locked live_explorer_organization_round_trip -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE) { throw 'Live Explorer acceptance failed' }
      - name: Native organizer interface review
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ./scripts/test-ui.ps1
      - name: Interface review evidence
        if: matrix.os == 'windows-2025' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interface-review
          path: target/ui-review/
          if-no-files-found: ignore
          retention-days: 1
      - name: Native failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-checks-${{ matrix.os }}
          path: target/native-checks/
          if-no-files-found: ignore
          retention-days: 3
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release Desktop Pilot ')
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.93.1'
      - name: Build and verify release executable
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 -SkipChecks
          ./scripts/test-native.ps1 -Executable target/release/desktop-pilot.exe -ReportDirectory target/release-checks
          ./scripts/package-release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/publish-release.ps1
      - name: Failed release diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verification
          path: target/release-checks/
          if-no-files-found: ignore
          retention-days: 7
