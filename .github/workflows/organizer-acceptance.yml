name: Organizer runtime acceptance
on:
  push:
    branches: [test/organizer-runtime-acceptance-20261031]
permissions:
  contents: read
concurrency:
  group: organizer-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.93.1-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Identify actual Windows desktop environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/organizer-acceptance | Out-Null
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsName, OsVersion, OsArchitecture | ConvertTo-Json | Set-Content target/organizer-acceptance/environment.json
          Get-Content target/organizer-acceptance/environment.json
          rustc -vV
          Get-Process explorer -ErrorAction Stop | Select-Object ProcessName, SessionId
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: Native executable integration without instrumentation
        shell: pwsh
        run: |
          ./scripts/test-native.ps1 -ReportDirectory target/organizer-acceptance/native
          Get-FileHash target/debug/desktop-pilot.exe -Algorithm SHA256 | Format-List | Out-File target/organizer-acceptance/production-executable.txt
      - name: Prepare separate input and screenshot acceptance harness
        shell: pwsh
        run: |
          python scripts/prepare-organizer-acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path target/organizer-acceptance-source/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
      - name: Build actual application with acceptance-only input probes
        shell: pwsh
        run: |
          cargo clippy --locked --manifest-path target/organizer-acceptance-source/Cargo.toml --target-dir target --bin desktop-pilot -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path target/organizer-acceptance-source/Cargo.toml --target-dir target --bin desktop-pilot
      - name: Actual mouse interaction, screenshots, Explorer and worker lifecycle
        shell: pwsh
        env:
          DP_ALLOW_DISPOSABLE_DESKTOP_TEST: YES_SYNTHETIC_FIXTURES_ONLY
        run: python scripts/run-organizer-acceptance.py --executable target/debug/desktop-pilot.exe --output target/organizer-acceptance/runtime --desktop
      - name: Record inspected source and evidence manifest
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/organizer-acceptance | Out-Null
          git rev-parse HEAD | Set-Content target/organizer-acceptance/source-commit.txt
          git archive --format=zip --output=target/organizer-acceptance/public-reviewed-source.zip HEAD
          Get-ChildItem target/organizer-acceptance -Recurse -File | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Set-Content target/organizer-acceptance/manifest.json
      - name: Short-lived review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: organizer-windows11-review
          path: target/organizer-acceptance/
          if-no-files-found: error
          retention-days: 1
