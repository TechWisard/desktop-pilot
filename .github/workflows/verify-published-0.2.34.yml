name: Verify public 0.2.34 downloads
on:
  push:
    branches:
      - maintenance/verify-public-0.2.34-20261028
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      EXPECTED_RELEASE_VERSION: '0.2.34'
      EXPECTED_RELEASE_COMMIT: '9a2f867e9876ba3f29b27f4d80c3f9439886fd24'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify unauthenticated downloads and exact source provenance
        run: python scripts/verify-public-release.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save public download verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-verification-0.2.34
          path: release-download-verification.json
          if-no-files-found: error
          retention-days: 30
