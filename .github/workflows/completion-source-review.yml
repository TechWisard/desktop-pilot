name: Completion source review
on:
  push:
    branches: [integration/desktop-pilot-completion-20261106]
    paths: [.github/workflows/completion-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export tracked public source only
        run: |
          mkdir -p review
          git archive --format=zip --output=review/source.zip HEAD
          git rev-parse HEAD > review/commit.txt
          sha256sum review/source.zip > review/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completion-source-review
          path: review/
          retention-days: 1
          if-no-files-found: error
