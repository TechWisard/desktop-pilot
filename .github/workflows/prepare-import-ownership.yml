name: Reproduce and verify quick-copy import
on:
  push:
    branches: [fix/import-ownership-20261027]
permissions:
  contents: write
concurrency:
  group: prepare-import-ownership-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - name: Verify baseline failures and corrected production paths
        shell: pwsh
        run: python scripts/prepare-import-ownership.py
