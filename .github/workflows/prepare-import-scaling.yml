name: Reproduce and verify bulk import scaling
on:
  push:
    branches: [perf/bulk-import-identity-index-20261028]
    paths:
      - scripts/prepare-import-scaling.py
      - src/ui/import_catalog.rs
      - src/ui/import_scaling_tests.rs
      - .github/workflows/prepare-import-scaling.yml
permissions:
  contents: write
concurrency:
  group: prepare-import-scaling-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.93.1'
          components: rustfmt, clippy
      - name: Reproduce baseline and verify corrected production import
        run: python scripts/prepare-import-scaling.py
      - name: Preserve diagnostic logs and unfinished patch
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/import-scaling | Out-Null
          git diff --binary | Out-File -Encoding utf8 target/import-scaling/remaining.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bulk-import-scaling-evidence
          path: target/import-scaling/
          if-no-files-found: error
          retention-days: 14
