name: Preserve completed acceptance evidence
on:
  push:
    branches: [maintenance/verified-storage-cleanup-20261106]
    paths: [.github/workflows/archive-completion-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download and verify bounded completed-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request, urllib.error, zipfile
          repo = os.environ['GH_REPO']
          assert repo == 'TechWisard/desktop-pilot'
          origin = f'https://api.github.com/repos/{repo}/'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(origin + path, headers=headers), timeout=30) as r:
                  return json.load(r)
          artifacts = []
          for page in range(1, 21):
              batch = api(f'actions/artifacts?per_page=100&page={page}')['artifacts']
              artifacts.extend(batch)
              if len(batch) < 100: break
          else: raise RuntimeError('Incomplete inventory')
          allowed_names = {'interface-review-windows-2025', 'interface-review-windows-11-arm', 'native-checks-windows-11-arm', 'native-checks-windows-2025', 'completion-source-review', 'input-desktop-probe'}
          selected = [a for a in artifacts if not a['expired'] and a['name'] in allowed_names and a['workflow_run']['head_branch'] == 'integration/desktop-pilot-completion-20261106' and a['created_at'] <= '2026-11-06T18:10:00Z']
          assert 1 <= len(selected) <= 100
          assert sum(a['size_in_bytes'] for a in selected) <= 150_000_000
          states = {}
          for a in selected:
              run = a['workflow_run']['id']
              if run not in states: states[run] = api(f'actions/runs/{run}')['status']
              assert states[run] == 'completed', f'Run {run} is still active'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl): return None
          opener = urllib.request.build_opener(NoRedirect)
          out = pathlib.Path('preservation'); out.mkdir()
          manifest = []
          with zipfile.ZipFile(out / 'completed-organizer-evidence.zip', 'w', zipfile.ZIP_STORED) as bundle:
              for a in sorted(selected, key=lambda a: a['id']):
                  request = urllib.request.Request(origin + f"actions/artifacts/{a['id']}/zip", headers=headers)
                  try:
                      response = opener.open(request, timeout=30)
                  except urllib.error.HTTPError as e:
                      if e.code != 302: raise
                      location = e.headers['Location']
                      assert location.startswith('https://')
                      # The signed archive URL receives no GitHub authorization header.
                      response = urllib.request.urlopen(location, timeout=60)
                  with response: data = response.read(6_000_001)
                  assert len(data) == a['size_in_bytes'] and len(data) <= 6_000_000
                  digest = 'sha256:' + hashlib.sha256(data).hexdigest()
                  assert digest == a['digest'], f"Digest mismatch for {a['id']}"
                  name = f"artifacts/{a['id']}.zip"
                  bundle.writestr(name, data)
                  manifest.append({k: a[k] for k in ('id', 'name', 'size_in_bytes', 'digest', 'workflow_run', 'created_at')})
              bundle.writestr('manifest.json', json.dumps({'repository':repo, 'artifacts':manifest}, indent=2))
          data = (out / 'completed-organizer-evidence.zip').read_bytes()
          (out / 'SHA256SUMS.txt').write_text(hashlib.sha256(data).hexdigest() + '  completed-organizer-evidence.zip\n')
          print(json.dumps({'preserved_count':len(manifest), 'original_bytes':sum(a['size_in_bytes'] for a in manifest), 'bundle_bytes':len(data), 'bundle_sha256':hashlib.sha256(data).hexdigest(), 'deleted':[]}))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completed-organizer-evidence-for-private-preservation
          path: preservation/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
